[project]
name = "godot-agent-loop-evals"
version = "0.1.0"
description = "Inspect AI evaluation harness for the Godot Agent Loop MCP server"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai==0.3.249",
  "jsonschema==4.25.1",
  "mcp==1.28.1",
  "openai==2.45.0",
]

[project.scripts]
godot-agent-loop-eval = "godot_agent_loop_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_agent_loop_eval"]

[tool.uv]
package = true
