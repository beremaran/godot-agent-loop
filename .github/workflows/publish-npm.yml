name: Publish npm release

# Kept workflow_dispatch-only so publication always requires an explicit wave
# approval and exact confirmation string.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed, fully tested release tag
        required: true
        default: v1.1.4
      confirmation:
        description: Type publish-@beremaran/godot-agent-loop@1.1.4
        required: true
      evaluation_run_id:
        description: Successful attested paired-behavioral workflow run ID
        required: true

permissions:
  contents: read
  actions: read
  attestations: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Require the exact publication confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "publish-@beremaran/godot-agent-loop@1.1.4"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify the signed exact-version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SIGNING_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILjYS4yppZ4WvM2fzE4jMkMd9kn+psrlErcOR19rK5DZ
        run: |
          ALLOWED_SIGNERS="$RUNNER_TEMP/godot-agent-loop-allowed-signers"
          printf '%s %s\n' 'berke@beremaran.com' "$RELEASE_SIGNING_KEY" > "$ALLOWED_SIGNERS"
          git -c gpg.ssh.allowedSignersFile="$ALLOWED_SIGNERS" verify-tag "$RELEASE_TAG"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_TAG#v}"

      - name: Download and verify the attested paired evaluation decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_RUN_ID: ${{ inputs.evaluation_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          EVALUATION_DIR="$RUNNER_TEMP/paired-evaluation"
          mkdir -p "$EVALUATION_DIR"
          gh run download "$EVALUATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name paired-behavioral-evaluation \
            --dir "$EVALUATION_DIR"
          gh attestation verify "$EVALUATION_DIR/comparison.json" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$EVALUATION_DIR/run-manifest.json" \
            --repo "$GITHUB_REPOSITORY"
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const comparison = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const expectedCommit = process.argv[3];
            const expectedVersion = process.argv[4].replace(/^v/, "");
            const digest = path => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            if (comparison.releaseDecision !== "passed") throw new Error("evaluation decision did not pass");
            if (comparison.inputs.scenarioCount < 24 || comparison.inputs.pairCount < 72) throw new Error("evaluation corpus or epoch count is incomplete");
            if (manifest.epochs < 3 || manifest.candidate.gitCommit !== expectedCommit) throw new Error("evaluation does not cover this exact commit with three epochs");
            if (manifest.candidate.packageVersion !== expectedVersion) throw new Error("evaluation package version does not match release tag");
            if (comparison.inputs.runManifest.sha256 !== digest(process.argv[2])) throw new Error("comparison is not linked to this run manifest");
            if (comparison.inputs.baseline.sha256 !== digest(process.argv[5])) throw new Error("baseline result hash does not match");
            if (comparison.inputs.candidate.sha256 !== digest(process.argv[6])) throw new Error("candidate result hash does not match");
          ' "$EVALUATION_DIR/comparison.json" "$EVALUATION_DIR/run-manifest.json" "$(git rev-parse HEAD)" "$RELEASE_TAG" "$EVALUATION_DIR/baseline-results.json" "$EVALUATION_DIR/candidate-results.json"

      - name: Install the audited Godot 4.7 engine
        env:
          GODOT_ARCHIVE_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
        run: |
          GODOT_ARCHIVE="$RUNNER_TEMP/Godot_v4.7-stable_linux.x86_64.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.7-stable"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$GODOT_ARCHIVE" \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA256" "$GODOT_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install and rebuild the exact source
        run: npm ci --ignore-scripts

      - name: Build, then recheck TypeScript, contracts, lint, and generated evidence
        run: npm run build && npm run check

      - name: Build the exact npm tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Publish the tested tarball with provenance
        run: npm publish ./dist/beremaran-godot-agent-loop-1.1.4.tgz --access public --provenance
