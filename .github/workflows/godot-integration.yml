name: Godot integration tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Re-check the primary target every Monday.
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the declared engines floor (active LTS); 24.x is the target.
        node-version: ["22.x", "24.x"]
    name: Build, tests, and lint (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run the retained TypeScript contract tests
        run: npm test

      - name: Report behavioral cases affected by this pull request
        if: github.event_name == 'pull_request'
        env:
          EVAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/select-evaluation-cases.mjs --base "$EVAL_BASE_SHA" \
            --head HEAD > evaluation-impact.json
          {
            echo '## Behavioral evaluation impact'
            echo
            echo '```json'
            cat evaluation-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: npm run lint


  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.7.1-stable"]
    name: Godot ${{ matrix.godot-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot ${{ matrix.godot-version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot-version }}/Godot_v${{ matrix.godot-version }}_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${{ matrix.godot-version }}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "GODOT_BIN=$HOME/.local/bin/godot" >> "$GITHUB_ENV"
          "$HOME/.local/bin/godot" --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the engine-surface audit is current
        run: node scripts/engine-surface-audit.js --check

      - name: Run pinned MCP conformance and Inspector protocol gates
        run: npm run eval:protocol

      - name: Install pinned uv toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: evals/inspect/uv.lock

      - name: Install the locked Inspect AI harness
        run: npm run eval:inspect:sync

      - name: Construct all Inspect tasks and probe native MCP/scorer replay
        run: xvfb-run -a npm run eval:inspect:check

      - name: Run one end-to-end Inspect eval/log/scorer smoke without a paid model
        run: xvfb-run -a npm run eval:inspect:smoke

      - name: Preserve MCP protocol evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-protocol-evaluation-${{ matrix.godot-version }}
          path: evals/reports/protocol/
          if-no-files-found: error

      - name: Run the representative MCP-to-Godot E2E suite
        run: xvfb-run -a npm run test:e2e


  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Platform ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Godot 4.7.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $binary = (Resolve-Path "godot/Godot_v4.7.1-stable_win64.exe").Path
          "GODOT_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Godot 4.7.1 on macOS
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip"
          unzip -q godot.zip -d godot
          GODOT_BIN="$PWD/godot/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run portable process, path, input, and window acceptance
        run: npm run test:e2e -- --run tests/e2e/cross-platform-smoke.test.ts
